name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    # Blacksmith runner. Its colocated cache backs actions/cache, so setup-go's
    # module and build cache is restored from Blacksmith, not GitHub.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      # Latest Go: current staticcheck releases need it. The test job covers
      # the minimum version in go.mod.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      # The generated stubs under proto/ trip deprecation and naming checks
      # that are not ours to fix; lint the hand-written SDK package only.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 .

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go build ./...
      # The live suite (TestLive) skips itself: PERMIO_API_KEY is not set here.
      - run: go test -race ./...

  # Runs TestLive against the development API when the PERMIO_DEV_API_KEY and
  # PERMIO_DEV_BASE_URL secrets are both available, and is skipped otherwise
  # (for example on pull requests from forks). The test writes fixed
  # sdk-it-go-* IDs, so runs are serialised.
  integration:
    name: Integration (dev API)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: permio-go-integration
      cancel-in-progress: false
    steps:
      - name: Check for the dev API secrets
        id: key
        env:
          HAS_KEY: ${{ secrets.PERMIO_DEV_API_KEY != '' && secrets.PERMIO_DEV_BASE_URL != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::PERMIO_DEV_API_KEY or PERMIO_DEV_BASE_URL is not available; skipping the integration test."
          fi
          echo "enabled=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/checkout@v1
        if: steps.key.outputs.enabled == 'true'
      - uses: actions/setup-go@v6
        if: steps.key.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Integration test against the dev API
        if: steps.key.outputs.enabled == 'true'
        env:
          PERMIO_API_KEY: ${{ secrets.PERMIO_DEV_API_KEY }}
          PERMIO_BASE_URL: ${{ secrets.PERMIO_DEV_BASE_URL }}
        run: |
          go test -count=1 -run '^TestLive$' -v . | tee live.txt
          # Fail if the suite was skipped rather than run.
          grep -q -- '--- PASS: TestLive ' live.txt
